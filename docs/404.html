<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found | MarketBase</title>
<style>
:root{--bg:#fbfaf8;--text:#16191a;--muted:#5f6769;--accent:#0f766e;--border:#e4e2dd}
@media (prefers-color-scheme:dark){:root{--bg:#0c0f0f;--text:#e8ecea;--muted:#98a5a2;--accent:#2dd4bf;--border:#242c2b}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--bg);color:var(--text);text-align:center;padding:24px;
  font:16px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
.code{font:600 13px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;
  color:var(--accent);text-transform:uppercase;margin-bottom:18px}
h1{font-size:clamp(28px,5vw,40px);letter-spacing:-.03em;margin:0 0 14px;font-weight:680}
p{color:var(--muted);margin:0 0 28px;max-width:420px}
a{display:inline-block;padding:11px 20px;border:1px solid var(--border);border-radius:8px;
  color:var(--text);text-decoration:none;font-weight:560}
a:hover{border-color:var(--accent)}
</style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <h1>Nothing here.</h1>
    <p>That page does not exist. It may have moved, or the link may be wrong.</p>
    <a href="/">Back to MarketBase</a>
  </div>
</body>
</html>
