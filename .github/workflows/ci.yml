name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    name: Secret and PII scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generic secret and PII patterns
        run: ./scripts/presubmit.sh

      # The gitleaks ACTION requires a paid license for organizations.
      # The gitleaks BINARY is MIT-licensed and free, so we run it directly.
      - name: gitleaks (full history)
        run: |
          VER=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1

  validate:
    name: Validate schema and manifests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4

      - name: Manifests are valid JSON
        run: |
          python3 -c "import json;[json.load(open(f)) for f in ['.claude-plugin/plugin.json','.claude-plugin/marketplace.json']]"

      - name: Python parses
        run: |
          for f in tools/*.py tools/lib/*.py; do python3 -m py_compile "$f"; done

      - name: Install psycopg
        run: pip install --quiet "psycopg[binary]"

      - name: Migrations apply cleanly
        run: |
          export MARKETBASE_URL="postgresql://postgres:postgres@localhost:5432/postgres"
          python3 tools/apply_schema.py | tee /tmp/first.log
          grep -q "MARKETBASE_APPLIED=$(ls schema/*.sql | wc -l | tr -d ' ')" /tmp/first.log

      - name: Second run is a no-op
        run: |
          export MARKETBASE_URL="postgresql://postgres:postgres@localhost:5432/postgres"
          python3 tools/apply_schema.py | tee /tmp/second.log
          grep -q "MARKETBASE_APPLIED=0" /tmp/second.log \
            || { echo "Second run applied migrations again; tracking is broken."; exit 1; }
