name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    name: Secret and PII scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets this job mint a short-lived OIDC token to authenticate to
      # Infisical. That is what removes the need to store any long-lived
      # credential in GitHub at all.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The denylist lives in Infisical (secret SANITIZE_DENYLIST, project
      # "Repo Sanitization"), the same copy developers' machines read, so there
      # is one source of truth rather than one per place-that-checks.
      #
      # That project holds NOTHING ELSE. Infisical grants access per project,
      # so an identity scoped to a shared project could read every secret in
      # it; this one can read the denylist and nothing more.
      #
      # Auth is OIDC: GitHub mints a short-lived token, Infisical trusts this
      # repository, and nothing secret is stored here. INFISICAL_IDENTITY_ID is
      # an identifier, not a credential — a var, not a secret.
      #
      # Until that machine identity exists, this step is a no-op and the run
      # falls back to the SANITIZE_DENYLIST repository secret below. The scan
      # itself still fails closed if BOTH are absent, so an unconfigured CI can
      # never silently skip Layer 2.
      # Pulls SANITIZE_DENYLIST from Infisical and exposes it as an env var,
      # which is exactly what presubmit.sh reads first.
      #
      # Auth is GitHub OIDC: GitHub mints a short-lived token, Infisical trusts
      # this repository, and NO long-lived credential is stored here.
      # INFISICAL_IDENTITY_ID and the project id are identifiers, not
      # credentials, so they are repo vars rather than secrets.
      #
      # secret-name narrows the fetch to the one secret. The identity is also a
      # viewer on a project that contains nothing else, so neither the request
      # nor the grant reaches any other secret.
      #
      # While the identity does not exist the step is skipped and the run falls
      # back to the repository secret below; the scan still fails closed if
      # both are absent, so CI can never silently skip Layer 2.
      - name: Fetch denylist from Infisical (OIDC)
        if: vars.INFISICAL_IDENTITY_ID != ''
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          oidc-audience: infisical
          project-id: ${{ vars.INFISICAL_TEAM_PROJECT_ID }}
          env-slug: dev
          secret-path: /
          secret-name: SANITIZE_DENYLIST
          export-type: env

      - name: Secret and PII patterns, including the private denylist
        # SANITIZE_DENYLIST carries the client/person names that must never
        # reach this public repo. It is a secret because the list itself is the
        # sensitive part. Fork PRs do not receive secrets, so Layer 2 is
        # explicitly optional there and the push-to-main run is the real gate.
        env:
          # Infisical first (one source of truth); the repository secret is the
          # fallback while the machine identity is being set up.
          # SANITIZE_DENYLIST is already in the environment when the Infisical
          # step ran; this line is the fallback for when it did not.
          SANITIZE_DENYLIST: ${{ env.SANITIZE_DENYLIST || secrets.SANITIZE_DENYLIST }}
          SANITIZE_DENYLIST_OPTIONAL: ${{ github.event.pull_request.head.repo.full_name != github.repository && '1' || '' }}
        run: ./scripts/presubmit.sh

      # The gitleaks ACTION requires a paid license for organizations.
      # The gitleaks BINARY is MIT-licensed and free, so we run it directly.
      - name: gitleaks (full history)
        run: |
          VER=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1

  validate:
    name: Validate schema and manifests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4

      - name: Manifests are valid JSON
        run: |
          python3 -c "import json;[json.load(open(f)) for f in ['.claude-plugin/plugin.json','.claude-plugin/marketplace.json']]"

      - name: Python parses
        run: |
          for f in tools/*.py tools/lib/*.py; do python3 -m py_compile "$f"; done

      - name: Install psycopg
        run: pip install --quiet "psycopg[binary]"

      - name: Migrations apply cleanly
        run: |
          export MARKETBASE_URL="postgresql://postgres:postgres@localhost:5432/postgres"
          python3 tools/apply_schema.py | tee /tmp/first.log
          grep -q "MARKETBASE_APPLIED=$(ls schema/*.sql | wc -l | tr -d ' ')" /tmp/first.log

      - name: Second run is a no-op
        run: |
          export MARKETBASE_URL="postgresql://postgres:postgres@localhost:5432/postgres"
          python3 tools/apply_schema.py | tee /tmp/second.log
          grep -q "MARKETBASE_APPLIED=0" /tmp/second.log \
            || { echo "Second run applied migrations again; tracking is broken."; exit 1; }
